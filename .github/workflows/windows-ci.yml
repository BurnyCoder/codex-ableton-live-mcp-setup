# Repository CI for the Windows-only v1 support contract.
# Source: https://docs.github.com/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#using-third-party-actions
name: Windows CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

# Every job only needs to read the checked-out public repository.
permissions:
  contents: read

# A newer run supersedes an older run for the same branch or pull request.
concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep Python and subprocess protocol checks deterministic on Windows.
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"
  # Make uv fail instead of silently changing the committed lockfile.
  UV_LOCKED: "1"
  UV_NO_PROGRESS: "1"

jobs:
  quality:
    name: Companion quality
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out the companion repository
        # actions/checkout v7.0.1, pinned to its full commit SHA.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install locked uv and Python 3.14
        # astral-sh/setup-uv v9.0.0, pinned to its full commit SHA.
        # Source: https://docs.astral.sh/uv/guides/integration/github/
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.27"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the committed environment
        run: uv sync --locked --all-extras --dev

      - name: Run companion unit tests
        run: uv run --locked --no-sync python -m pytest -q

      - name: Check public Markdown
        run: >-
          uv run --locked --no-sync python tools/check_markdown.py .
          --require-readme-contract

      - name: Scan the public tree for private evidence and secrets
        run: uv run --locked --no-sync python tools/public_safety_scan.py .

      - name: Confirm quality checks did not rewrite locked inputs
        run: git diff --exit-code -- pyproject.toml uv.lock

  upstream-integration:
    name: Exact upstream integration
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out the companion repository
        # actions/checkout v7.0.1, pinned to its full commit SHA.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install locked uv and Python 3.14
        # astral-sh/setup-uv v9.0.0, pinned to its full commit SHA.
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.27"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the committed environment
        run: uv sync --locked --all-extras --dev

      - name: Verify pins, tests, validation, and STDIO
        run: >-
          uv run --locked --no-sync python tools/verify_upstream.py
          --manifest config/versions.json

      - name: Confirm integration checks did not rewrite locked inputs
        run: git diff --exit-code -- pyproject.toml uv.lock
