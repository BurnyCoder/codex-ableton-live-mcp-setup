# Repository CI for the Windows-only v1 support contract.
# Source: https://docs.github.com/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#using-third-party-actions
name: Windows CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

# Every job only needs to read the checked-out public repository.
permissions:
  contents: read

# A newer run supersedes an older run for the same branch or pull request.
concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep Python and subprocess protocol checks deterministic on Windows.
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"
  # Make uv fail instead of silently changing the committed lockfile.
  UV_LOCKED: "1"
  UV_NO_PROGRESS: "1"

jobs:
  quality:
    name: Companion quality
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out the companion repository
        # actions/checkout v5.1.0, pinned to its full commit SHA.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install locked uv and Python 3.14
        # astral-sh/setup-uv v7.6.0, pinned to its full commit SHA.
        # Source: https://docs.astral.sh/uv/guides/integration/github/
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.11.27"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the committed environment
        run: uv sync --locked --all-extras --dev

      - name: Run companion unit tests
        run: uv run --locked --no-sync python -m pytest -q

      - name: Check public Markdown
        run: >-
          uv run --locked --no-sync python tools/check_markdown.py .
          --require-readme-contract

      - name: Build the sanitized experiment PDF
        run: >-
          uv run --locked --no-sync python tools/build_report_pdf.py
          --input reports/experiments/2026-08-11-windows-baseline.md
          --output reports/codex-ableton-live-mcp-setup-report.pdf

      - name: Verify PDF structure and extracted text
        run: >-
          uv run --locked --no-sync python tools/verify_pdf.py
          reports/codex-ableton-live-mcp-setup-report.pdf
          --source reports/experiments/2026-08-11-windows-baseline.md
          --min-pages 1

      - name: Confirm the committed PDF matches canonical Markdown
        run: git diff --exit-code -- reports/codex-ableton-live-mcp-setup-report.pdf

      - name: Scan the public tree for private evidence and secrets
        run: uv run --locked --no-sync python tools/public_safety_scan.py .

      - name: Confirm quality checks did not rewrite locked inputs
        run: git diff --exit-code -- pyproject.toml uv.lock

      - name: Upload the verified release report
        # actions/upload-artifact v4.6.2, pinned to its full commit SHA.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-ableton-live-mcp-setup-report-${{ github.sha }}
          path: |
            reports/experiments/2026-08-11-windows-baseline.md
            reports/codex-ableton-live-mcp-setup-report.pdf
          if-no-files-found: error
          retention-days: 14

  upstream-integration:
    name: Exact upstream integration
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out the companion repository
        # actions/checkout v5.1.0, pinned to its full commit SHA.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install locked uv and Python 3.14
        # astral-sh/setup-uv v7.6.0, pinned to its full commit SHA.
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.11.27"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the committed environment
        run: uv sync --locked --all-extras --dev

      - name: Verify pins, tests, validation, and STDIO
        run: >-
          uv run --locked --no-sync python tools/verify_upstream.py
          --manifest config/versions.json

      - name: Confirm integration checks did not rewrite locked inputs
        run: git diff --exit-code -- pyproject.toml uv.lock
